name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix dashboard-next
      - run: npm run build:dashboard
      - name: Run npm test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -ne 0 ]; then
            tail -n 80 "$RUNNER_TEMP/npm-test.log" | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi
          exit "$test_status"
