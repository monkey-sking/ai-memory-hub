name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm ci --prefix dashboard-next
      - run: node scripts/check-public-repo-boundary.js
      - run: npm run build:dashboard
      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test -- --test-concurrency=1 2>&1 | tee test-output.log
      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output.log

